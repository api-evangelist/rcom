name: Rcom
description: >-
  Rcom (Reliance Communications, RCOM) is an Indian telecommunications and
  digital infrastructure company providing enterprise connectivity, voice, and
  data-center services. Its portfolio spans dedicated internet access and DDoS
  protection, IP transit, MPLS VPN, Ethernet and leased lines, cloud networking
  (Cloud X Fusion / Cloud X WAN), enterprise voice (E1 PRI, SIP trunk, IP
  Centrex), cloud telephony and hosted contact centers, toll-free and global
  access numbers, audio/web conferencing, colocation and managed data-center
  services, and global subsea cable networks via its Global Cloud Xchange
  subsidiary. The company surfaced in the API Evangelist network as a portfolio
  lead; enrichment confirms an enterprise service business with customer and
  billing portals but no public developer program, API surface, or well-known
  discovery documents.
